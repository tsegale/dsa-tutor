<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>DSA Tutor</title>
    <!-- Applies the saved (or OS) theme before first paint so a reload never
         flashes light. Same key and rule as src/store/useThemeStore.ts. -->
    <script>
      try {
        var saved = localStorage.getItem('dsa-tutor-theme')
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {
        // Storage blocked: useThemeStore still resolves and applies the theme on mount.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
